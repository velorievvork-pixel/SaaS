# Насколько самостоятельно агент делает каждое действие.
#   ask   — всегда готовит и ждёт «ок» владельца
#   learn — ждёт «ок», пока не наберёт `graduate_after` одобрений подряд без правок, потом делает сам
#   auto  — делает сам, владельцу — в вечерней сводке
# Любая правка или отказ владельца сбрасывает счёт и возвращает действие в learn.
# Правила outbound_guard.py и лимиты шлюза действуют при любом режиме.

graduate_after: 5

actions:
  first_message:      auto   # первое сообщение новому лиду (WhatsApp или почта)
  followup:           auto   # второе касание через 3 рабочих дня тишины
  reply_refusal:      auto   # «не интересует» → одна вежливая фраза и статус «Отказ»
  reply_opt_out:      auto    # «не пишите» → ничего не пишем, стоп-лист, статус «Отказ»
  reply_contact_given: auto  # дали другой номер/почту → разогрев на новый контакт
  reply_forwarded:    auto   # «передадим руководству» → короткое спасибо, проверка через 3 рабочих дня
  reply_greeting:     auto    # только «здравствуйте» → ждать продолжения до конца рабочего дня
  reply_already_have: auto   # «уже есть / работаем с …» → спросить, что всё равно делают руками
  reply_no_time:      auto   # «нет времени / не сейчас» → предложить вернуться через пару недель
  reply_think:        auto   # «подумаем / обсудим внутри» → предложить короткую выжимку для коллег
  reply_price:        auto  # спрашивают цену → «Артём назовёт на звонке», предложить созвон
  reply_proposal:     auto   # «пришлите КП» → сначала 15 минут с Артёмом
  reply_meeting:      ask     # согласны на созвон → передача Артёму (нужны его слоты)
  reply_question:     ask     # вопрос по сути → ответ только из facts.yaml
  reply_bot_question: ask     # «вы бот?» → честно: пишет с помощью ассистента, владелец смотрит; никогда не отрицать
  reply_unclear:      ask     # всё, что агент не узнал
  handoff:            ask     # группа с Артёмом и справка для него

# Никогда не делать сам, какой бы ни была статистика
never_auto:
  - reply_bot_question
  - reply_meeting
  - handoff

limits:
  whatsapp_new_chats_per_day: 15   # то же в шлюзе (DAILY_NEW_CHATS)
  emails_per_day: 10
