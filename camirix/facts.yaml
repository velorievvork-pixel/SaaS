    status: confirmed
    source: "презентация Camirix_client.pdf, слайд 2 и слайд 9"
    confirmed_by: презентация клиента
    confirmed_on: 2026-09-22
    value: >
      Camirix продаёт рост выручки без роста штата. Тезис слайда 2 дословно:
      «Фонд оплаты труда — главный тормоз масштабирования бизнеса. Чтобы удвоить
      выручку, классический бизнес вынужден удвоить штат.»
  crm_objection:
    status: confirmed
    source: "презентация, слайд 2, блок «Главный парадокс»"
    confirmed_by: презентация клиента
    confirmed_on: 2026-09-22
    value: >
      «Существующие IT-инструменты (CRM, ERP и т.д.) не решают проблему —
      они требуют ещё больше людей для работы в них.» Camirix работает поверх
      учётных систем, а не вместо них.
  what_not_to_say:
    status: confirmed
    confirmed_by: вывод из слайда 2, подтверждён пользователем
    confirmed_on: 2026-09-22
    value: >
      НЕ писать «поможем настроить воронку», «наведём порядок в CRM»,
      «внедрим CRM». По деку это описание ПРОБЛЕМЫ, а не решения.
      Такие формулировки продают то, что дек называет частью проблемы.

