# ЕДИНСТВЕННЫЙ ИСТОЧНИК ПРАВДЫ О ПРОДУКТЕ CAMIRIX
#
# Правило, ради которого этот файл существует:
#   ЛЮБОЕ утверждение о продукте в исходящем сообщении должно ссылаться
#   на факт из этого файла со status: confirmed.
#   Нет факта — нет утверждения. Никаких исключений, никакой памяти модели.
#
# status:
#   confirmed   — подтверждено владельцем (Артём) или пользователем. Можно писать.
#   unconfirmed — видели в источнике, но никто не подтвердил. В письма НЕЛЬЗЯ.
#   stale       — было верно, теперь опровергнуто. В письма НЕЛЬЗЯ. Оставлено,
#                 чтобы агент узнавал цифру и блокировал её, а не «вспоминал».
#
# Каждый факт обязан иметь source, confirmed_by, confirmed_on.
# confirmed_by: null означает, что писать нельзя, чем бы ни выглядел source.

