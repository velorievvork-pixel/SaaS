    confirmed_by: null
    value: "500 тыс - 1 млн ₽"
  price_model:
    status: confirmed
    source: "пользователь, со слов владельца"
    confirmed_by: пользователь
    confirmed_on: 2026-09-22
    value: >
      У продукта НЕТ прайс-листа для холодных касаний. Цену называет Артём
      лично на звонке с покупателем, и она зависит от того, что покупатель
      просит. Это не «цена пока не известна» — это модель ценообразования.
    implications: >
      1. В исходящих письмах и сообщениях сумма НЕ НАЗЫВАЕТСЯ НИКОГДА,
         ни как факт, ни как «от», ни как порядок величины. Не потому что
         мы её ждём, а потому что она не наша.
      2. Если адресат спрашивает цену в ответе — это ХОРОШИЙ знак и повод
         на звонок. Правильный ответ: цена зависит от того, что нужно,
         Артём назовёт на звонке под вашу задачу. Не придумывать, не
         говорить «около», не повторять 29 000.
      3. Цифра 29 000 была анкером с сайта и созвона, а не прайсом.
         Повторять её как цену — значит связать Артёму руки на переговорах.

  quotable_anchor:
    status: unconfirmed
    confirmed_by: null
    value: null
    note: >
      Механизм на будущее. Если Артём когда-нибудь разрешит называть
