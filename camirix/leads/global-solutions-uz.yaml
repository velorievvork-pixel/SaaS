process_to_automate: >
  Вакансия прямо называет то, чего сейчас нет: систему прогноза продаж, регулярных
  разборов воронки и сделок, коммерческой отчётности по клиентам-банкам и крупному
  бизнесу ("формировать прогноз продаж на месяц, квартал и год", "проводить регулярные
  разборы воронки, сделок и результатов команды"). Это ручной процесс, который новый
  CCO должен строить с нуля, а не действующая система — при headcount 22 добавлять
  под это отдельных аналитиков означает расти штатом пропорционально росту продаж.

identity_check: >
  Подтверждено трижды независимо, не только по названию: (1) типовой договор на оказание
  услуг GlobalPay, опубликованный на официальном сайте global.uz, в реквизитах прямо
  указывает "АО «GLOBAL SOLUTIONS» ... ИНН: 302 000 726 ... Сайт: www.gs.uz" — точное
  совпадение ИНН с записью в реестре myorg.uz (АО «GLOBAL SOLUTIONS», ИНН 302000726,
  Яккасарайский район); (2) юр.адрес из реестра ("Миробод-2, дом 39а") совпадает с
  адресом места работы в вакансии ("Ташкент, 2-й проезд Миробод, 39А") и с адресом
  на официальной странице LinkedIn компании; (3) карточка работодателя на hh.uz
  (employer 9879112, тот же, что разместил вакансию) сама указывает сайт "http://global.uz".

notes: >
  L2 (выручка) сознательно не заполнено — country: UZ, для стран вне РФ выручка не
  обязательна (решение от 23.09). Headcount взят с официальной страницы компании на
  LinkedIn (22), а не с myorg.uz/orginfo.uz: с февраля 2023 в Узбекистане категория
  предприятия (микро/малое/среднее/крупное) считается по ГОДОВОМУ ДОХОДУ, а не по
  численности (Указ Президента №УП-21 от 10.02.2023) — бесплатные узбекские реестры
  вообще не публикуют численность как отдельное число, это ключевая находка разведки
  источников по Узбекистану. Не путать с Paylov/Octagram JSC — визуально похожий
  финтех-бренд, но другое юрлицо (ИНН 307993034), проверено отдельно и не связано.
