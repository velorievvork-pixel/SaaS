# Второй лид новой волны. Сигнал сильнее, чем у AZMT: компания сама называет
# точные цифры (не оценка агрегатора) и прямо описывает координационную
# перегрузку — один РОП на три локации.

company: ТОО IELTS CLUB (бренд Embassy — Посольство Английской Речи)
inn: "760112402792"    # БИН/ИИН найден на связанную регистрацию основателя (ИП с тем же именем
                        # руководителя); отдельный БИН именно ТОО в открытых источниках не найден
domain: ""
country: KZ
about: >
  Образовательный центр подготовки к IELTS, основан Тамарой Ильясовой (25 лет
  преподавания), работает 9 лет, 30 000+ студентов, средний балл выпускников 7,5.
  3 офлайн-точки в Алматы (Минусинская 13Б, Варламова 33) и Астане + онлайн.

vacancy:
  url: "https://almaty.hh.kz/vacancy/137534846"
  status: active
  checked_on: "2026-09-23"
  title: Руководитель отдела продаж
  salary: "от 500 000 ₸"

firmographics:
  headcount: 80           # самоотчёт компании: "80+ сотрудников, включая 60+ преподавателей"
  source_url: "https://astana.hh.kz/employer/10363544"

decision_maker:
  name: Ильясова Тамара Альмуратовна
  role: основатель
  source_url: "https://astana.hh.kz/employer/10363544"

contact:
  channel: whatsapp
  value: "+7 707 036 0225"
  how_found: >
    Общий номер школы (2gis, карточка Embassy, filiал Минусинская 13Б/Варламова 33,
    один номер на обе точки). Это НЕ подтверждённый личный контакт Ильясовой —
    линия ресепшн/записи. Как и с AZMT, канал первого касания — пользователь
    сам пишет и просит соединить с основателем, а не автоматическая отправка.

signal:
  type: операционный рост / координация нескольких локаций одним человеком
  quote: "Сейчас ищем единого РОПа на продажи Алматы, Астаны и онлайн"
  source_url: "https://almaty.hh.kz/vacancy/137534846"

process_to_automate: >
  Координация продаж, конверсий и отчётности по трём точкам (2 офлайн + онлайн)
  сейчас завязана на одного человека вместо системы — именно та точка, где
  рост означает либо больше людей, либо автоматизацию координации.

identity_check: >
  СЛАБО, честно. inn выше — это ИИН ИП «IELTS CLUB» (Ильясова Тамара
  Альмуратовна), не БИН юрлица «ТОО IELTS CLUB» с hh.kz — отдельный БИН
  ТОО не найден. Совпадает только ФИО основателя между двумя источниками.
  Адрес (Минусинская 13Б) НЕ подтверждает: по этому же адресу в реестре
  зарегистрирована минимум ещё одна не связанная компания (SATGURU
  CORPORATE, БИН 260340016247) — здание на несколько юрлиц, адрес ничего
  не доказывает. Самый слабый identity_check из всей пачки.

notes: >
  L2: выручка не заполнена (country: KZ, решение от 23.09). ВАЖНО: этот лид
  прошёл L8 формально (поле заполнено), но по существу личность юрлица не
  подтверждена так же надёжно, как у остальных трёх лидов пачки (AZMT,
  IRON PLAST, ПМК — там БИН напрямую увязан с сайтом/адресом компании).
  Перед касанием: либо принять риск (сам сигнал — вакансия и её текст —
  верифицирован независимо от точного юрлица), либо потратить время на
  прямой поиск устава/лицензии образовательного центра под точным БИН.
