process_to_automate: >
  Координация заказа между тремя точками контакта — менеджер по продажам
  (оформление в 1С, эскизы в CorelDRAW), производство и логистика — сейчас держится
  на ручном сопровождении каждого менеджера ("контролировать выполнение заказов,
  взаимодействуя с отделами логистики и производства"). При открытии нового
  VIP-филиала эта же схема ручной координации должна масштабироваться на ещё одну
  точку — то есть либо больше людей на стыках, либо автоматизация передачи заказа
  между отделами.

identity_check: >
  СРЕДНЕ, честно. Основатель Андабек Рыскулбеков в интервью kaktus.media (апрель
  2025) прямо назван основателем холдинга Cheber Group, объединяющего "производство
  мебели, зеркал и фурнитуры". Официальный Instagram холдинга (@chebergroup, 60.3K
  подписчиков) в шапке профиля прямо указывает: "Зеркала → @ainek_service" — то есть
  сам холдинг называет аккаунт ainek_service своим направлением. Карточка
  работодателя на headhunter.kg называется буквально "АйнекСервис (CHEBER GROUP)" —
  то же соответствие бренд↔аккаунт, что и в Instagram. Это связывает вакансию именно
  с холдингом основателя. НЕ подтверждено при этом: точный БИН юрлица "АйнекСервис"
  (headhunter.kg не публикует ИНН работодателя; в реестре нашлась только похожая по
  названию "Айнек Холдинг" с другим, по всей видимости, не тем же самым директором —
  см. поле inn). Совпадение бренда через официальные соцсети сильнее, чем просто
  совпадение названия (см. docstring lead_gate.py про "Food City" vs "Food City
  Group"), но слабее прямого совпадения БИН на сайте, как в azmt-kz.

notes: >
  Единственный лид по КР, полностью прошедший gate на сегодня (23.09) после
  сверки ~20 активных вакансий РОП/КД в Кыргызстане (headhunter.kg) — у всех
  подходящих по сигналу компаний headcount либо сильно ниже (стартапы 5-15 чел,
  напр. MAShop/ОсОО Манн Аман), либо сильно выше ICP (МПЗ им. Фрунзе >150 чел по
  employment.kg, EUROSTYLE 220 чел, Байлык Финанс 500+ чел, Сталь Торг ~1700 чел
  по их же Instagram — все самоотчёты, не оценки). У Cheber Group headcount в ICP,
  но текущая вакансия не лидерская — компромисс отражён выше. inn оставлен пустым
  сознательно: пустая строка — честно "не найдено", а не заглушка с выдуманным
  числом. Перед касанием: было бы правильно найти вакансию РОП/КД именно у этой
  компании (следить за headhunter.kg/employer/9072645) или получить БИН через
  прямой запрос в Минюст КР (record.minjust.gov.kg) по названию.
