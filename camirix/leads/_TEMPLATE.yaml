# Шаблон карточки лида. Копировать, заполнять, прогонять через lead_gate.py.
# Пустое поле = FAIL. Поле «не найдено» тоже FAIL — это честно, но не готово.

company: ""            # ООО «Название»
inn: ""                # ИНН/БИН — по нему реестр отдаёт первое лицо
domain: ""             # example.ru
country: "RU"          # RU | KZ | BY | ... Вне RU выручка в firmographics не обязательна
about: ""              # чем занимается, одной строкой

vacancy:
  url: ""              # ссылка на КОНКРЕТНУЮ вакансию
  status: ""           # active | archived — только active проходит
  checked_on: ""       # ГГГГ-ММ-ДД, когда сам открывал страницу. Не старше 7 дней
  title: ""
  salary: ""           # вилка, если указана — это цифра адресата, её можно называть

firmographics:
  headcount: 0         # ICP 20-150
  revenue_mln_rub: 0   # ICP 100-3000 млн ₽. Обязательно для RU, необязательно для остального СНГ
  source_url: ""       # checko.ru / audit-it.ru / statsnet.co / kompra.kz / сайт

decision_maker:
  name: ""             # Фамилия Имя Отчество. ЕГРЮЛ отдаёт по ИНН
  role: ""             # гендиректор / собственник / учредитель. НЕ РОП
  source_url: ""

contact:
  channel: ""          # email | telegram | whatsapp | phone
  value: ""            # личный. info@ и прочие общие — FAIL
  how_found: ""        # где взял. Если подобран через contact_finder.py — так и написать,
                       # и проверить существование адреса до отправки

signal:
  type: ""             # массовый наём на рутинные позиции | повторная публикация |
                       # проектная формулировка про автоматизацию | операционный рост
  quote: ""            # ДОСЛОВНО со страницы. Не пересказ
  source_url: ""

process_to_automate: ""  # какой повторяемый процесс снимаем с людей и почему думаешь,
                         # что он у них есть. Без этого письмо не о чем

identity_check: ""       # ЧЕМ подтверждено, что компания из вакансии и компания из
                         # реестровой карточки — одна и та же фирма, а не тёзка.
                         # Например: юр.адрес реестра совпадает с адресом на сайте
                         # компании; сайт из вакансии указывает этот же ИНН/БИН в
                         # футере; ФИО руководителя совпадает в обоих источниках.
                         # Совпадения одного названия НЕДОСТАТОЧНО — см. lead_gate.py L8.

verified_on: ""         # ГГГГ-ММ-ДД. Заполняет НЕ тот, кто собирал карточку: заново открыть
verified_what: ""       # вакансию, страницу контакта, источник identity_check; что сверено
notes: ""
