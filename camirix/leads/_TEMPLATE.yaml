  status: ""           # active | archived — только active проходит
  checked_on: ""       # ГГГГ-ММ-ДД, когда сам открывал страницу. Не старше 7 дней
  title: ""
  salary: ""           # вилка, если указана — это цифра адресата, её можно называть

