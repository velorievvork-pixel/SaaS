# Конфигурация линтера.
#
# Без явного набора правил ruff берёт умолчания, которые расходятся с
# сознательными решениями в шлюзах. Ниже — что выбрано и почему исключено.

target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PLW", "FURB", "RUF"]

ignore = [
  # BLE001 «не ловите голый Exception». В шлюзах это НАМЕРЕННО: они обязаны
  # блокировать действие при ЛЮБОМ сбое разбора, а не только при ожидаемом.
  # Сузить except здесь — значит позволить письму уйти при неучтённой ошибке,
  # то есть сломать принцип fail closed, ради которого шлюзы и написаны.
  "BLE001",
  # DTZ011 «date.today() без таймзоны». Сравнивается возраст проверки вакансии
  # в днях; привязка к таймзоне точности не добавит, а шума добавит.
  "DTZ011",
  # RUF001/RUF003 кириллица рядом с латиницей в строках и комментариях.
  # Тексты писем и сообщения об ошибках на русском — это предметная область.
  "RUF001", "RUF002", "RUF003",
]

[lint.per-file-ignores]
# В тестах допустимы длинные фикстуры и обращение к приватному.
"tests/*" = ["E501", "PLW1510"]
